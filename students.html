<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header>

    <h2>STUDENT MANAGEMENT</h2>

    <a href="dashboard.html">
        Dashboard
    </a>

</header>


<div class="container">


    <div class="form-box">

        <h2>Add Student</h2>


        <form id="studentForm">


            <input
                type="text"
                id="regn"
                placeholder="Registration Number"
                required
            >


            <input
                type="text"
                id="name"
                placeholder="Student Name"
                required
            >


            <input
                type="text"
                id="course"
                placeholder="Course"
                required
            >


            <button type="submit">
                Add Student
            </button>


        </form>

    </div>


    <h2>Student List</h2>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Registration Number</th>

                    <th>Name</th>

                    <th>Course</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="studentsTable">

            </tbody>

        </table>

    </div>


</div>


<script
    type="module"
    src="students.js">
</script>

</body>

</html>
