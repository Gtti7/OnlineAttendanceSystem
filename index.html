<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teacher Login - Attendance System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Online Attendance</h1>

        <p>Teacher Login</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Teacher Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

</div>


<script type="module" src="login.js"></script>

</body>

</html>
